[project]
name = "movie-review-sentiment"
version = "0.1.0"
description = "AAI-501 final team project: classifying IMDB movie-review sentiment (logistic regression vs. feed-forward neural network) as a feature-generation signal for film recommendation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "datasets",
    "joblib",
    "pyarrow",
    "python-dotenv",
    "tensorflow>=2.21.0",
    "seaborn>=0.13.2",
    "openai>=2.46.0",
]

# The two heaviest deps were deferred to build-time and have both landed with
# their owning notebooks: tensorflow with 03 (Keras NN), openai with 05
# (OpenAI-compatible LLM-as-judge client).

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets>=8.1.8",
    "jupyterlab",
    "ruff",
]

[tool.uv]
# Virtual project: install the dependencies but do not build/install this
# repo as a package. src/shared.py is imported via a sys.path bootstrap in
# each notebook, not as an installed package.
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
